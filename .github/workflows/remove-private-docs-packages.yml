name: Remove approved contaminated package versions
on:
  workflow_dispatch:
permissions:
  packages: write
jobs:
  remove-contaminated-versions:
    if: github.repository == 'soomrenald/k2lab_runpod'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete only approved package version IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import subprocess
          version_ids = [1319464203, 1319464169, 1319464189, 1318521545, 1318521480, 1318521518, 1318454829, 1318454779, 1318454801, 1086967820, 1086967803, 1086967812, 1086552092, 1086552073, 1086552082, 1085159593, 1085159529, 1085159559, 1084946523, 1084946465, 1084946494, 1084567862, 1084567810, 1084567843, 1072833507, 1072833490, 1072833500, 1071974503, 1071974465, 1071974480, 1071745916, 1071745870, 1071745896, 1069611293, 1069611255, 1069611273, 1069381992, 1069381963, 1069381975, 1067346922, 1067346899, 1067346910, 1066993885, 1066993871, 1066993876, 1066432264, 1066432251, 1066432259, 1065543070, 1065543042, 1065543060, 1065478918, 1065478900, 1065478910, 1065342644, 1065342622, 1065342631, 1065240934, 1065240910, 1065240924, 1064952083, 1064952059, 1064952074, 1064515662, 1064515632, 1064515647, 1064459956, 1064459937, 1064459947, 1064394942, 1064394901, 1064394920, 1064338538, 1064338510, 1064338522, 1064169237, 1064169194, 1064169214, 1058733735, 1058733699, 1058733715, 1058570759, 1058570736, 1058570749, 1058548423, 1058548403, 1058548413, 1058275847, 1058275830, 1058275838, 1054921094, 1054921078, 1054921084]
          for number, version_id in enumerate(version_ids, 1):
              subprocess.run([
                  'gh', 'api', '--method', 'DELETE',
                  f'/users/soomrenald/packages/container/k2lab-runpod-workspace/versions/{version_id}'
              ], check=True)
              print(f'Deleted {number}/{len(version_ids)} approved package versions.', flush=True)
          PYTHON

[project]
name = "k2lab-krea2-volumetric-control"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=1,<2",
  "diffusers>=0.36,<1",
  "einops>=0.8,<1",
  "huggingface-hub>=1.3,<2",
  "numpy>=2.1",
  "pillow>=12.3",
  "safetensors>=0.5",
  "sentencepiece>=0.2,<1",
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers>=5,<6",
  "wandb>=0.19,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py312"
